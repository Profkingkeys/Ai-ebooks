<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Healthy habit lab</title><style>body{font:18px/1.6 system-ui;background:#eef4ea;color:#183e43}main{max-width:40rem;margin:5vh auto;padding:2rem;background:white;border-radius:20px}button{font:inherit;padding:12px 18px;margin:8px;border:2px solid #186d61;border-radius:10px;background:#e9f4e8;color:#183e43}button:focus-visible{outline:3px solid #c27b13;outline-offset:3px}button:disabled{opacity:.5}#feedback{min-height:4rem}</style><main><h1>One small choice</h1><p>You've used the bathroom. What comes before lunch?</p><button id="wash">Wash my hands</button><button id="eat">Eat immediately</button><p id="feedback" role="status" aria-live="polite">Choose a habit.</p><button id="retry">Try again</button><p><small>This is a tiny state-machine lab, not the complete KidSim game.</small></p></main><script>
let state={done:false,correct:false};
function choose(s,a){if(s.done)return s;if(a==='wash')return {done:true,correct:true};if(a==='eat')return {done:true,correct:false};return s}
function render(){document.getElementById('feedback').textContent=state.done?(state.correct?'Good choice. Wet, soap, scrub for at least 20 seconds, rinse and dry.':'Try again: wash after the toilet and before eating.'):'Choose a habit.';for(const id of ['wash','eat'])document.getElementById(id).disabled=state.done}
for(const id of ['wash','eat'])document.getElementById(id).onclick=()=>{state=choose(state,id);render()};document.getElementById('retry').onclick=()=>{state={done:false,correct:false};render()};
</script></html>
